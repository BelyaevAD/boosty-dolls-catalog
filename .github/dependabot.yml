version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "Asia/Barnaul"
    open-pull-requests-limit: 5
    groups:
      official-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
